<template id="f02-filieres-template">
  <div data-hf-id="hf-2f45" id="root" data-composition-id="02-filieres" data-width="1920" data-height="1080" data-start="0" data-duration="6.2">
    <style>
      #root {
        position: relative;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
      }
      #f02-filieres-scene {
        position: absolute;
        top: 0;
        left: 0;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: #FFFFFF;
      }
      #f02-filieres-cam {
        position: absolute;
        top: 0;
        left: 0;
        width: 1920px;
        height: 7309px;
        will-change: transform;
      }
      #f02-filieres-plate {
        display: block;
        width: 1920px;
        height: 7309px;
        max-width: none;
      }
    </style>

    <div data-hf-id="hf-b5kv" id="f02-filieres-scene" class="clip" data-start="0" data-duration="6.2" data-track-index="0">
      <div data-hf-id="hf-0878" id="f02-filieres-cam" data-layout-allow-overflow="">
        <img data-hf-id="hf-n9a7" id="f02-filieres-plate" src="assets/full-page.png" width="1920" height="7309" alt="">
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script>
      (function () {
        window.__timelines = window.__timelines || {};
        var cam = document.getElementById("f02-filieres-cam");

        // Seed the handoff pose (camY 1088) so any seek to t=0 lands on it.
        gsap.set(cam, { x: 0, y: -1088, scale: 1, opacity: 1 });

        var tl = gsap.timeline({ paused: true });

        // Scene 1 (0.0–0.3s): still at camY 1088.
        tl.set(cam, { x: 0, y: -1088, scale: 1, opacity: 1 }, 0);

        // Scene 2 (0.3–1.5s): long in-out descent, camY 1088 → 2290.
        tl.fromTo(
          cam,
          { y: -1088 },
          { y: -2290, duration: 1.2, ease: "power2.inOut", immediateRender: false },
          0.3
        );

        // Scene 3 (1.5–3.4s): hold at camY 2290.

        // Scene 4 (3.4–4.6s): short soft glide, camY 2290 → 2531.
        tl.fromTo(
          cam,
          { y: -2290 },
          { y: -2531, duration: 1.2, ease: "sine.inOut", immediateRender: false },
          3.4
        );

        // Scene 5 (4.6–6.2s): hold at camY 2531 (handoff_out, speed 0).
        tl.set(cam, { y: -2531 }, 6.2);

        window.__timelines["02-filieres"] = tl;
      })();
    </script>
  </div>
</template>
